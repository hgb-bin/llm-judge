[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "llm-judge"
version = "0.3.0"
description = "Rating natural language translations easily via LLMs."
keywords = ["nlp", "llm", "translation"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Micha J. Birklbauer", email = "micha.birklbauer@fh-hagenberg.at" },
]
maintainers = [
    { name = "Micha J. Birklbauer", email = "micha.birklbauer@fh-hagenberg.at" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable"
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "google-genai>=2.23.0",
    "ollama>=0.6.2",
    "openai>=3.13.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.20.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
llm-judge = "llm_judge:main"

[project.urls]
Homepage = "https://github.com/hgb-bin/llm-judge"
Documentation = "https://hgb-bin.github.io/llm-judge"
Repository = "https://github.com/hgb-bin/llm-judge.git"
Issues = "https://github.com/hgb-bin/llm-judge/issues"
